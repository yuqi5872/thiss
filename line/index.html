<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>加入 LINE</title>
<!--
  加好友轉址頁　同一份檔案部署到各站的 /line/index.html

  ── 為什麼要有這一頁 ──
  加好友的網址在 line.me 網域，我們裝不了 GA4。從 IG bio 直接連過去的話，
  一次點擊都記不到，儀表板永遠是 0。這一頁在自家網域，GA4 正常觸發，記完再轉走。

  ── 為什麼一份檔案而不是每站一份 ──
  四個站各有自己的 GA4 資源與官方帳號。做成四份的話，改一次邏輯要改四個地方，
  遲早會有一份忘了改。這裡用 location.hostname 選設定，部署時原樣複製即可。

  **一定要部署在該站自己的網域**。放錯網域的話點擊會記到別站的 GA4 資源，
  會議總覽的站別就標錯了（例如電子站的加好友被算成體育站）。

  ── 跟 LINE 原生「設定加入好友管道」的關係：兩個一起用，不是二選一 ──
    LINE 原生   記「實際加了幾個好友」，只在 LINE 後台看得到
    這一頁      記「點了幾次」，進 GA4 → 儀表板 → 會議報告
  兩者相減＝點了但沒加成的流失率。channels 裡填該人設在 LINE 後台的專屬
  「加入好友管道」網址，LINE 那邊也就分得出來源；沒建專屬管道就留空字串，
  會退回該站共用的官方帳號網址——**GA4 這邊照樣分得出是誰帶的**（靠 ch），
  只是 LINE 後台那份看不到細分。人手不夠時先這樣用，不必為每支開一個管道。

  ── 網址參數 ──
    ?ch=<persona code>   誰帶來的
    &at=<bio|post>       放在哪
    &pid=<貼文utm>       選填。貼文專用，例 miya-0811-1
                         有帶的話 utm_content 就用它，該則貼文的 LINE 點擊
                         會跟它其他成效並排在同一列，不用另外對照。
  也吃標準的 utm_source / utm_medium / utm_content（見下方 ch/at/pid 推導）。
-->
<script>
(function () {
  var STATIONS = {
    'picks168.com': {
      name: '體育賽事情報站｜Picks168',
      ga: 'G-G961Y6MX5Q',
      oa: '@554zzkjg',
      channels: {
        god:     'https://lin.ee/NGNtzBj',
        shizu:   'https://lin.ee/Ydc5kq8',
        cc:      'https://lin.ee/zdjqjY6',
        miya:    'https://lin.ee/tOztxat',
        cyq:     'https://lin.ee/S6OFVIJ',
        hahaqiu: 'https://lin.ee/UqoYjNiS'
      }
    },
    'tsaishen888.com': {
      name: '電子遊戲觀測所',
      ga: 'G-XCBKJTBVTL',
      oa: '@806ugpjh',
      channels: {
        yuchiazhi:  'https://line.me/R/oaMessage/%40806ugpjh/?%E6%88%91%E8%A6%81%E5%B7%A5%E5%85%B7%20P08',
        fishdriver: 'https://line.me/R/oaMessage/%40806ugpjh/?%E6%88%91%E8%A6%81%E5%B7%A5%E5%85%B7%20P09',
        haogame:    'https://line.me/R/oaMessage/%40806ugpjh/?%E6%88%91%E8%A6%81%E5%B7%A5%E5%85%B7%20P10',
        zhansen:    'https://line.me/R/oaMessage/%40806ugpjh/?%E6%88%91%E8%A6%81%E5%B7%A5%E5%85%B7%20P12',
        egameobs:   'https://line.me/R/oaMessage/%40806ugpjh/?%E6%88%91%E8%A6%81%E5%B7%A5%E5%85%B7%20P30',
        xiaoye:     'https://lin.ee/Rd7IBMdf',
        jiaqing612: 'https://lin.ee/SuB0MiZ'
      }
    },
    'dgcasnio.com': { name: '百家站', ga: '', oa: '', channels: {} },
    'lott168.com':  { name: '彩票站', ga: '', oa: '', channels: {} }
  };

  var host = location.hostname.toLowerCase();
  var key = Object.keys(STATIONS).filter(function (d) {
    return host === d || host.endsWith('.' + d);
  })[0];
  var ST = STATIONS[key] || STATIONS['picks168.com'];
  var CHANNELS   = ST.channels || {};
  var OA_URL     = ST.oa ? 'https://line.me/R/ti/p/' + encodeURIComponent(ST.oa) : '';
  var GA_ID      = ST.ga;

  var q = new URLSearchParams(location.search);
  var pick = function (k, max) {
    return (q.get(k) || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, max);
  };
  var med = pick('utm_medium', 32);
  var ch  = pick('ch', 32) || pick('utm_source', 32) || 'unknown';
  var at  = pick('at', 16) || (med.indexOf('bio') >= 0 ? 'bio'
                             : med ? 'post' : 'unknown');
  var pid = pick('pid', 48) || pick('utm_content', 48);

  var target = CHANNELS[ch] || OA_URL;

  /* 🔴 2026-08-28 加：代號不在 channels 白名單時，medium 改標 _noroute。
     為什麼要有這一段——2026-08-27 獎號通出現一個沒登記的代號 haotong（手打的，
     連 &at= 都沒有），它照樣轉得過去、GA4 照樣記到點擊，但因為沒有專屬 lin.ee，
     跳的是通用官方帳號連結、不帶 oat__id，**LINE 後台那半邊的歸因整個斷掉**，
     而且斷得完全無聲——沒有錯誤、沒有告警，是查別的事才偶然發現的。
     旗標 has_line_route 早就埋在下面的 gtag 事件裡，但它是自訂維度、沒註冊，
     所以永遠看不到。與其去 GA4 設自訂維度（四個資源各設一次、還不能追溯），
     不如借用「來源/媒介」這個每天都在看的內建報表：斷掉的會自己跳出來。
        line_addfriend           正常，有 oat__id，LINE 後台分得出來
        line_addfriend_noroute   斷了，只有 GA4 這半邊追得到
     要修的話是把該代號加進上面的 channels，或把連結改成正確代號。 */

  /* 各站自己的代理碼（來源 ai-launcher/config/sites_mirror.json 的 proxy_param）。
     一定要用該站自己的碼，填錯的話首存會記到別站頭上，帳本就分不出這條路值不值得做。 */
  var REG_PROXY = {
    'picks168.com':    'zsuv56',
    'tsaishen888.com': 'dvjhkv',
    'dgcasnio.com':    'rs82gq',
    'lott168.com':     'ia4juq'
  };
  function regUrl(reason) {
    var p = REG_PROXY[key];
    if (!p) return '';
    return 'https://ys89.bet/activity/entry?url=/activity/detail/firstDeposit/NTD'
         + '&proxy=' + p
         + '&utm_source=' + encodeURIComponent(key)
         + '&utm_medium=line_fallback'
         + '&utm_campaign=first_deposit'
         + '&utm_content=' + encodeURIComponent(ch + '_' + reason);
  }

  var hasRoute = !!CHANNELS[ch];
  var MEDIUM   = hasRoute ? 'line_addfriend' : 'line_addfriend_noroute';

  var content = pid || (ch + '_' + at);

  var url = new URL(location.href);
  url.searchParams.set('utm_source',   ch);
  url.searchParams.set('utm_medium',   MEDIUM);
  url.searchParams.set('utm_campaign', 'oa_join');
  url.searchParams.set('utm_content',  content);

  if (!target) {
    document.addEventListener('DOMContentLoaded', function () {
      var b = document.querySelector('.box');
      if (b) b.innerHTML = '<p>這一站的官方帳號還沒設定完成。</p>';
    });
    return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var a = document.getElementById('fallback');
    if (a) a.href = target;
  });

  var redirected = false;

  /* ── 備援出口（2026-09-14 加）──────────────────────────────────────
     只在「LINE 這條路已經失敗」的時候才出現，不跟主出口搶點擊。
     shown 旗標防止 pageshow 與計時器重複觸發、重複送 GA4 事件。 */
  var exitShown = false;
  function showExit(reason) {
    if (exitShown) return;
    exitShown = true;
    var box = document.querySelector('.box');
    if (!box) return;
    var reg = regUrl(reason);
    var html = '<h1>LINE 沒有自動開啟</h1>'
      + '<p class="lead">可以再試一次，或直接到平台註冊——'
      + '加 LINE 是為了拿工具用的，<b>註冊不需要先加好友</b>。</p>'
      + '<a class="btn b1" id="retry" href="' + target + '">再試一次・開啟 LINE</a>';
    if (reg) {
      html += '<a class="btn b2" id="goreg" href="' + reg + '" target="_blank"'
            + ' rel="nofollow sponsored noopener">前往註冊・首充送 1000</a>'
            + '<p class="note">首充加碼有 1 倍流水要求，詳細條件以平台活動頁為準。</p>';
    }
    box.innerHTML = html;
    if (typeof gtag === 'function') {
      gtag('event', 'line_fallback_shown', {
        station: key || 'unknown', channel: ch, reason: reason,
        has_reg_exit: reg ? 'yes' : 'no'
      });
    }
    var r = document.getElementById('goreg');
    if (r) r.addEventListener('click', function () {
      if (typeof gtag !== 'function') return;
      /* 同時送 outbound_click——站群既有的儀表板與 cro_behavior_watch.py 認的是
         這個事件名，只送自訂事件的話這條路在報表上等於不存在。 */
      gtag('event', 'outbound_click', {
        link_domain: 'ys89.bet', link_url: r.href,
        source_page: '/line/', channel: ch, station: key || 'unknown'
      });
      gtag('event', 'line_fallback_click', {
        station: key || 'unknown', channel: ch, reason: reason
      });
    });
  }

  /* 桌機開 line.me/R/oaMessage/ 是已知必壞的組合（會落到 LINE 官網首頁，
     不是對話視窗），所以桌機遇到蓋章連結時直接不轉址、改給雙出口卡。
     一般的 lin.ee 加好友連結桌機是正常的，維持自動轉址。 */
  var isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
  var stampLink = target.indexOf('/oaMessage/') !== -1;

  function go() {
    if (redirected) return;
    redirected = true;
    if (!isMobile && stampLink) { showExit('desktop_oamessage'); return; }
    /* 轉址成功的話這個頁面會被銷毀，計時器跟著消失；只有轉址沒生效
       （被瀏覽器擋掉、深連結沒人接）才會走到 showExit。 */
    setTimeout(function () { showExit('no_redirect'); }, 2500);
    location.replace(target);
  }

  /* 使用者從 LINE 按上一頁回來時，頁面是從 bfcache 還原的，
     不會重跑上面的程式；沒有這一段的話他看到的是一個轉不完的 spinner。 */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) showExit('back_from_line');
  });

  if (GA_ID) {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', GA_ID, { page_location: url.toString(), transport_type: 'beacon' });
    gtag('event', 'line_add_friend_click', {
      channel: ch, placement: at, post_id: pid || '(none)',
      station: key || 'unknown',
      has_line_route: CHANNELS[ch] ? 'yes' : 'no',
      transport_type: 'beacon',
      event_callback: go
    });
    setTimeout(go, 1200);
  } else {
    go();
  }
})();
</script>
<style>
  body{margin:0;height:100dvh;display:grid;place-items:center;
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:#0b1220;color:#e8eaf0}
  .box{text-align:center;padding:24px}
  .dot{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
       border:3px solid #2a3550;border-top-color:#06c755;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#06c755}
  /* 備援出口卡（2026-09-14 加）。按鈕最小高度 48px 是手機可點區的下限；
     b2 用實心綠是因為它才是這張卡真正要被點的那一顆。 */
  .box h1{font-size:19px;margin:0 0 10px;color:#fff;font-weight:800}
  .box .lead{font-size:14.5px;line-height:1.7;margin:0 auto 18px;max-width:20em;color:#c3c9d8}
  .box .lead b{color:#fff}
  .btn{display:block;box-sizing:border-box;width:100%;max-width:19em;margin:0 auto 10px;
       min-height:48px;line-height:1.4;padding:13px 18px;border-radius:10px;
       font-weight:800;font-size:15px;text-decoration:none;text-align:center}
  .b1{background:#182238;color:#e8eaf0;border:1px solid #2a3550}
  .b2{background:#06c755;color:#06210f;border:1px solid #06c755}
  .box .note{font-size:12px;line-height:1.6;color:#8d95a8;margin:12px auto 0;max-width:22em}
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <p>正在帶你前往 LINE…</p>
    <p><a id="fallback" href="#">沒有自動跳轉？點這裡</a></p>
  </div>
</body>
</html>
